<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Legal Shield</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page-wrapper">
        <!-- Logo on the light gray area -->
        <div class="logo-container">
            <img src="https://legalshield.com.co/wp-content/uploads/2024/12/logo-principal-legal-shield-color.avif" alt="Legal Shield Logo" class="brand-logo">
        </div>

        <!-- Blue Form Card -->
        <main class="form-card">
            <h2>¿Requieres apoyo jurídico?</h2>
            <h1>Ponte en contacto con nosotros</h1>

        <form id="contactForm" class="contact-form">
            <!-- Full Width Field -->
            <div class="form-group full-width">
                <input type="text" name="nombre" placeholder="Nombre completo" required>
                <i class="fa-solid fa-user"></i>
            </div>

            <!-- Half Width Fields -->
            <div class="form-group">
                <input type="text" name="cargo" placeholder="Cargo en la empresa" required>
                <i class="fa-solid fa-building"></i>
            </div>
            <div class="form-group">
                <input type="text" name="empresa" placeholder="Nombre de la empresa" required>
                <i class="fa-solid fa-building"></i>
            </div>

            <div class="form-group">
                <input type="email" name="correo" placeholder="Correo corporativo" required>
                <i class="fa-solid fa-envelope"></i>
            </div>
            <div class="form-group">
                <input type="tel" name="whatsapp" placeholder="Teléfono / WhatsApp" required>
                <i class="fa-solid fa-phone"></i>
            </div>

            <div class="form-group">
                <input type="text" name="ciudad" placeholder="Ciudad" required>
                <i class="fa-solid fa-location-dot"></i>
            </div>
            <div class="form-group">
                <select name="servicio" required>
                    <option value="" disabled selected>Selecciona el servicio</option>
                    <option value="Derecho Empresarial">Derecho Empresarial</option>
                    <option value="Programas de Cumplimiento">Programas de Cumplimiento</option>
                    <option value="Derecho Digital">Derecho Digital</option>
                    <option value="Otro">Otro</option>
                </select>
                <i class="fa-solid fa-layer-group"></i>
            </div>

            <!-- Full Width Field -->
            <div class="form-group full-width">
                <textarea name="mensaje" placeholder="Cuéntanos brevemente tu necesidad (ej. auditoría, política de datos, etc.)" required></textarea>
                <i class="fa-solid fa-pencil"></i>
            </div>

            <!-- Checkbox -->
            <div class="checkbox-group">
                <input type="checkbox" name="aceptacion" id="aceptacion" required>
                <label for="aceptacion">Acepto el <a href="https://legalshield.com.co/politica-de-tratamiento-de-datos/" target="_blank" rel="noopener noreferrer">tratamiento de mis datos</a> para ser contactado(a) por Legal Shield.</label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="submitBtn">
                <span>Enviar ahora</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>

            <!-- Success Message -->
            <div class="success-message" id="successMsg">
                Gracias por tu mensaje. Se ha enviado.
            </div>
        </form>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
